// ============================================================
// LÓGICA DO SISTEMA — não precisa editar abaixo
// ============================================================
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
let ALUNOS = [];
let filt = 'todos', srch = '';

document.getElementById('ref-date').textContent =
  'Referência: ' + TODAY.toLocaleDateString('pt-BR') + ' — atualiza ao recarregar';

function diffDays(d){ if(!d) return null; const t=new Date(d);t.setHours(0,0,0,0);return Math.round((t-TODAY)/86400000); }

function parseVcto(v){
  if(!v||v.trim()==='') return null;
  const p=v.trim().split('/');
  if(p.length===2){
    const dia=parseInt(p[0]),mes=parseInt(p[1]);
    const ano = mes < TODAY.getMonth() ? TODAY.getFullYear()+1 : TODAY.getFullYear();
    return new Date(ano,mes-1,dia);
  }
  return null;
}

function parseTermino(s){
  if(!s||s.trim()===''||s.trim()==='undefined') return null;
  const p=s.trim().split('/');
  if(p.length===2){
    const a=parseInt(p[0]), b=parseInt(p[1]);
    // formato MM/AAAA (ex: 01/2027) — b é o ano (4 dígitos)
    if(b>100) return new Date(b, a-1, 1);
    // formato AAAA/MM
    return new Date(a, b-1, 1);
  }
  return null;
}

function fmtMes(s){
  if(!s||s.trim()===''||s.trim()==='undefined') return '—';
  const p=s.split('/');
  const meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  if(p.length===2){
    const a=parseInt(p[0]), b=parseInt(p[1]);
    // MM/AAAA (ex: 01/2027)
    if(b>100) return meses[a-1]+'/'+String(b).slice(-2);
    // AAAA/MM
    return meses[b-1]+'/'+String(a).slice(-2);
  }
  return s;
}

function alerta(r){
  const sp=(r.STATUS||'').trim().toUpperCase();
  const dv=diffDays(parseVcto(r.VCTO));
  const dt=diffDays(parseTermino(r.TERMINO));

  if(sp==='PAGO') return {tipo:'pago',label:'Pago',cls:'bg-green',rowCls:'',disparo:false};

  if(sp==='VENCIDO') return {tipo:'vencido',label:'Em atraso',cls:'bg-red',rowCls:'row-over',disparo:true};

  if(sp==='A VENCER'){
    if(dv!==null && dv===0) return {tipo:'disparo',label:'Vence HOJE',cls:'bg-red',rowCls:'row-over',disparo:true};
    if(dv!==null && dv===1) return {tipo:'disparo',label:'Vence amanhã',cls:'bg-amber',rowCls:'row-warn',disparo:true};
    if(dv!==null && dv<=5 && dv>0) return {tipo:'disparo',label:'Vcto em '+dv+'d',cls:'bg-amber',rowCls:'row-warn',disparo:true};
    if(dt!==null && dt<=60) return {tipo:'fim60',label:'Fim em '+dt+'d',cls:'bg-blue',rowCls:'',disparo:false};
    if(dt!==null && dt<=90) return {tipo:'fim90',label:'Fim ~'+dt+'d',cls:'bg-gray',rowCls:'',disparo:false};
    return {tipo:'avencer',label:'A vencer',cls:'bg-gray',rowCls:'',disparo:false};
  }

  return {tipo:'ok',label:'—',cls:'bg-gray',rowCls:'',disparo:false};
}

function waMensagem(r, tipo){
  const nome = r.NOME.split(' ')[0];
  const resp = (r.RESPONSAVEL||'').split(' ')[0] || nome;
  const vcto = r.VCTO||'';
  const dv = diffDays(parseVcto(vcto));
  const dt = diffDays(parseTermino(r.TERMINO));
  const valor = parseFloat((r.VALOR||'0').replace(',','.')).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

  if(tipo==='vencido')
    return `Olá ${resp}! Tudo bem? 😊\nPassando para avisar que a mensalidade do *${nome}* está em aberto no valor de *${valor}*.\nQualquer dúvida, estou à disposição!`;

  if(tipo==='disparo'){
    if(dv===0) return `Olá ${resp}! Tudo bem? 😊\nLembrando que a mensalidade do *${nome}* vence *hoje* (${vcto}) no valor de *${valor}*. Qualquer dúvida, estou aqui!`;
    if(dv===1) return `Olá ${resp}! 😊\nLembrando que a mensalidade do *${nome}* vence *amanhã* no valor de *${valor}*. Qualquer dúvida é só chamar!`;
    return `Olá ${resp}! 😊\nPassando para lembrar que a mensalidade do *${nome}* vence em *${dv} dias* (${vcto}) no valor de *${valor}*. Qualquer dúvida, estou à disposição!`;
  }

  if(tipo==='fim60'||tipo==='fim90'){
    const curso = (r.CURSOS||'').split(';')[0].trim();
    return `Olá ${resp}! 😊\nO *${nome}* está quase concluindo o curso de *${curso}* — faltam cerca de ${dt} dias!\nQue tal conversarmos sobre a próxima jornada? Temos opções incríveis para ele continuar evoluindo. 🚀`;
  }
  return '';
}

function waLink(r, tipo){
  const tel = (r.TELEFONE||'').replace(/\D/g,'');
  const msg = waMensagem(r, tipo);
  if(!tel) return 'https://wa.me/?text='+encodeURIComponent(msg);
  return 'https://wa.me/'+tel+'?text='+encodeURIComponent(msg);
}

function spBadge(s){
  s=(s||'').trim().toUpperCase();
  if(s==='PAGO') return '<span class="bg bg-green">Pago</span>';
  if(s==='VENCIDO') return '<span class="bg bg-red">Vencido</span>';
  if(s==='A VENCER') return '<span class="bg bg-amber">A vencer</span>';
  return '<span class="bg bg-gray">'+s+'</span>';
}

function setF(f,el){
  filt=f;
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  renderTabela();
}
function buscar(v){ srch=v.toLowerCase(); renderTabela(); }

function filtrados(){
  let d=[...ALUNOS];
  if(srch) d=d.filter(r=>(r.NOME||'').toLowerCase().includes(srch)||(r.RESPONSAVEL||'').toLowerCase().includes(srch)||(r.CODIGO||'').toLowerCase().includes(srch));
  if(filt==='vencido') d=d.filter(r=>(r.STATUS||'').toUpperCase()==='VENCIDO');
  else if(filt==='avencer') d=d.filter(r=>(r.STATUS||'').toUpperCase()==='A VENCER');
  else if(filt==='pago') d=d.filter(r=>(r.STATUS||'').toUpperCase()==='PAGO');
  else if(filt==='disparo') d=d.filter(r=>alerta(r).disparo);
  else if(filt==='fim60') d=d.filter(r=>{ const dt=diffDays(parseTermino(r.TERMINO)); return dt!==null&&dt<=60; });
  else if(filt==='fim90') d=d.filter(r=>{ const dt=diffDays(parseTermino(r.TERMINO)); return dt!==null&&dt>60&&dt<=90; });
  return d;
}

function renderMetrics(){
  const d=ALUNOS;
  const pagos=d.filter(r=>(r.STATUS||'').toUpperCase()==='PAGO').length;
  const vencidos=d.filter(r=>(r.STATUS||'').toUpperCase()==='VENCIDO').length;
  const avencer=d.filter(r=>(r.STATUS||'').toUpperCase()==='A VENCER').length;
  const recPaga=d.filter(r=>(r.STATUS||'').toUpperCase()==='PAGO').reduce((a,r)=>a+parseFloat((r.VALOR||'0').replace(',','.')),0);
  const recAberto=d.filter(r=>(r.STATUS||'').toUpperCase()!=='PAGO').reduce((a,r)=>a+parseFloat((r.VALOR||'0').replace(',','.')),0);
  const fim60=d.filter(r=>{ const dt=diffDays(parseTermino(r.TERMINO)); return dt!==null&&dt<=60; }).length;
  const disparar=d.filter(r=>alerta(r).disparo).length;
  document.getElementById('metrics').innerHTML=`

function setBanner(tipo, msg){
  const b=document.getElementById('banner-conexao');
  const t=document.getElementById('banner-texto');
  b.className='banner banner-'+tipo;
  t.textContent=msg;
}

function parseCSV(text){
  const lines=text.trim().split('\n');
  if(lines.length<2) return [];
  const rawHeaders=lines[0].split(',').map(h=>h.trim().replace(/"/g,''));
  // Mapeamento das colunas reais da planilha para os campos do sistema
  const MAP = {
    'NOME':'NOME',
    'CÓDIGO':'CODIGO','CODIGO':'CODIGO','CÃ³DIGO':'CODIGO',
    'IDADE':'IDADE',
    'CURRÍCULOS ATIVOS':'CURSOS','CURRICULOS ATIVOS':'CURSOS','CURRÃ\u008DCULOS ATIVOS':'CURSOS',
    'STATUS DO CONTRATO':'STATUS_CONTRATO',
    'RESPONSÁVEL PRINCIPAL':'RESPONSAVEL','RESPONSAVEL PRINCIPAL':'RESPONSAVEL','RESPONSÃ\u0081VEL PRINCIPAL':'RESPONSAVEL',
    'TÉRMINO CURSO':'TERMINO','TERMINO CURSO':'TERMINO','TÃ\u0089RMINO CURSO':'TERMINO','TÉRMINO DO CURSO':'TERMINO',
    'TELEFONE':'TELEFONE',
    'VCTO':'VCTO',
    'PAGTO':'PGTO','PGTO':'PGTO',
    'VALOR':'VALOR',
    'STATUS':'STATUS'
  };
  const headers=rawHeaders.map(h=>{
    const upper=h.toUpperCase().trim();
    return MAP[upper]||upper;
  });
  return lines.slice(1).map(line=>{
    const vals=[]; let cur=''; let inQ=false;
    for(let c of line){
      if(c==='"'){inQ=!inQ;}
      else if(c===','&&!inQ){vals.push(cur.trim());cur='';}
      else cur+=c;
    }
    vals.push(cur.trim());
    const obj={};
    headers.forEach((h,i)=>{ obj[h]=(vals[i]||'').replace(/"/g,''); });
    return obj;
  }).filter(r=>r.NOME&&r.NOME.trim()!=='');
}

async function carregarDados(){
  if(false){
    ALUNOS=[...DEMO];
    setBanner('blue','ℹ️  Modo demonstração — configure o link do Google Sheets no arquivo HTML para usar dados reais.');
    renderMetrics(); renderTabela();
    return;
  }
  try{
    setBanner('blue','⏳ Carregando dados da planilha...');
    // Tenta direto, se falhar usa proxy CORS
    let res;
    try {
      res = await fetch(SHEETS_URL);
      if(!res.ok) throw new Error('HTTP '+res.status);
    } catch(e1) {
      try {
        res = await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(SHEETS_URL));
        if(!res.ok) throw new Error('HTTP '+res.status);
      } catch(e2) {
        throw new Error('Não foi possível conectar. Abra o arquivo num servidor ou Google Sites.');
      }
    }
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text=await res.text();
    const dados=parseCSV(text);
    if(!dados.length) throw new Error('Planilha vazia ou colunas não encontradas');
    ALUNOS=dados;
    setBanner('green','✅ Dados carregados do Google Sheets — '+ALUNOS.length+' alunos encontrados. Última atualização: '+new Date().toLocaleTimeString('pt-BR'));
  }catch(e){
    console.error(e);
    ALUNOS=[...DEMO];
    setBanner('red','⚠️ Não foi possível conectar ao Google Sheets ('+e.message+'). Mostrando dados de demonstração.');
  }
  renderMetrics(); renderTabela();
}

function recarregar(){ carregarDados(); }

function exportarCSV(){
  const headers=['Nome','Código','Responsável','Telefone','Cursos','Término','Vcto','Pgto','Valor','Status'];
  const rows=ALUNOS.map(r=>[r.NOME,r.CODIGO,r.RESPONSAVEL,r.TELEFONE,r.CURSOS,r.TERMINO,r.VCTO,r.PGTO,r.VALOR,r.STATUS].map(v=>`"${(v||'').replace(/"/g,'""')}"`).join(','));
  const csv='\uFEFF'+[headers.join(','),...rows].join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='alunos_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

carregarDados();
