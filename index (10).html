<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Financeiro de Alunos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f5f0;color:#1a1a1a;font-size:14px}
header{background:#fff;border-bottom:1px solid #e0e0da;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
header h1{font-size:17px;font-weight:700;color:#1a1a1a}
header p{font-size:11px;color:#999;margin-top:2px}
.btn{background:#fff;border:1px solid #ccc;border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;color:#333;font-family:Arial,sans-serif}
.btn:hover{background:#f0f0ec}
.btn-blue{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px;padding:14px 24px}
.mc{background:#fff;border-radius:8px;border:1px solid #e8e8e2;padding:11px 13px}
.mc .lb{font-size:10px;color:#999;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.04em}
.mc .vl{font-size:21px;font-weight:700;color:#1a1a1a}
.mc .sb{font-size:10px;color:#bbb;margin-top:2px}
.filters{display:flex;gap:6px;padding:0 24px 10px;flex-wrap:wrap;align-items:center}
.fb{background:#fff;border:1px solid #ddd;border-radius:20px;padding:5px 13px;font-size:12px;cursor:pointer;color:#555;font-family:Arial,sans-serif}
.fb:hover{background:#f0f0ec}
.fb.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.si{border:1px solid #ccc;border-radius:8px;padding:6px 11px;font-size:12px;background:#fff;color:#333;font-family:Arial,sans-serif;flex:1;min-width:160px;max-width:260px}
.tw{padding:0 24px 24px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px;background:#fff;border-radius:10px;overflow:hidden;border:1px solid #e8e8e2;min-width:860px}
th{text-align:left;padding:9px;font-weight:700;font-size:10px;color:#777;border-bottom:1px solid #e8e8e2;text-transform:uppercase;letter-spacing:0.05em;background:#fafaf7;white-space:nowrap}
td{padding:9px;border-bottom:1px solid #f2f2ee;color:#1a1a1a;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafaf7}
.bg{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.bg-green{background:#dcfce7;color:#15803d}
.bg-red{background:#fee2e2;color:#b91c1c}
.bg-amber{background:#fef9c3;color:#a16207}
.bg-blue{background:#dbeafe;color:#1e40af}
.bg-gray{background:#f3f4f6;color:#4b5563}
.bg-purple{background:#ede9fe;color:#6d28d9}
.row-over td{background:#fff5f5}
.row-warn td{background:#fffbeb}
.wa{display:inline-flex;align-items:center;gap:5px;background:#25d366;color:#fff;border:none;border-radius:7px;padding:5px 10px;font-size:11px;cursor:pointer;font-family:Arial,sans-serif;text-decoration:none;font-weight:600;white-space:nowrap}
.wa:hover{background:#22c55e}
.wa.ofertar{background:#1d4ed8}
.nr{text-align:center;padding:2.5rem;color:#bbb;font-size:13px}
.banner{margin:12px 24px;padding:10px 14px;border-radius:8px;font-size:12px;line-height:1.5}
.banner-blue{background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe}
.banner-red{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
.banner-green{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}
</style>
</head>
<body>
<header>
  <div>
    <h1>Painel Financeiro de Alunos</h1>
    <p id="ref-date"></p>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn" onclick="carregarDados()">Atualizar</button>
    <button class="btn btn-blue" onclick="exportarCSV()">Exportar CSV</button>
  </div>
</header>
<div id="banner" class="banner banner-blue">Carregando...</div>
<div class="metrics" id="metrics"></div>
<div class="filters">
  <button class="fb on" onclick="setF('todos',this)">Todos</button>
  <button class="fb" onclick="setF('vencido',this)">Vencidos</button>
  <button class="fb" onclick="setF('avencer',this)">A vencer</button>
  <button class="fb" onclick="setF('pago',this)">Pagos</button>
  <button class="fb" onclick="setF('disparo',this)">Disparar hoje</button>
  <button class="fb" onclick="setF('fim60',this)">Fim em 60 dias</button>
  <button class="fb" onclick="setF('fim90',this)">Fim em 90 dias</button>
  <input class="si" type="text" placeholder="Buscar aluno ou responsavel..." oninput="buscar(this.value)">
</div>
<div class="tw">
  <table>
    <thead><tr>
      <th style="width:15%">Aluno</th>
      <th style="width:14%">Responsavel</th>
      <th style="width:17%">Curso(s)</th>
      <th style="width:8%">Termino</th>
      <th style="width:6%">Vcto</th>
      <th style="width:6%">Pgto</th>
      <th style="width:8%">Valor</th>
      <th style="width:9%">Status</th>
      <th style="width:9%">Alerta</th>
      <th style="width:8%">WhatsApp</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<script>
var APPS_URL="https://script.google.com/macros/s/AKfycbxCEm--Y61hI-pirA63yV5_fvR7bbMlL6-f580VkRsQaoXCqJmUQRd5gqsX_Vcadwbi/exec";
var TODAY=new Date();TODAY.setHours(0,0,0,0);
var ALUNOS=[],filt='todos',srch='';
document.getElementById('ref-date').textContent='Referencia: '+TODAY.toLocaleDateString('pt-BR');

function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();}

function isoToDia(v){
  if(!v||v==='')return '';
  var s=String(v);
  if(s.indexOf('T')>-1){var d=new Date(s);if(!isNaN(d))return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0');}
  return s;
}
function isoToMesAno(v){
  if(!v||v==='')return '';
  var s=String(v);
  if(s.indexOf('T')>-1){var d=new Date(s);if(!isNaN(d))return String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear();}
  return s;
}
function diffDays(vcto){
  if(!vcto||vcto==='')return null;
  var p=vcto.split('/');if(p.length!==2)return null;
  var dia=parseInt(p[0]),mes=parseInt(p[1]);
  var ano=mes<(TODAY.getMonth()+1)?TODAY.getFullYear()+1:TODAY.getFullYear();
  var d=new Date(ano,mes-1,dia);d.setHours(0,0,0,0);
  return Math.round((d-TODAY)/86400000);
}
function diffDaysT(t){
  if(!t||t==='')return null;
  var p=t.split('/');if(p.length!==2)return null;
  var mes=parseInt(p[0]),ano=parseInt(p[1]);
  var d=new Date(ano,mes-1,1);d.setHours(0,0,0,0);
  return Math.round((d-TODAY)/86400000);
}
function fmtMes(t){
  if(!t||t==='')return '-';
  var p=t.split('/');if(p.length!==2)return t;
  var m=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return m[parseInt(p[0])-1]+'/'+String(p[1]).slice(-2);
}
function alerta(r){
  var sp=(r.STATUS||'').trim().toUpperCase();
  var dv=diffDays(r.VCTO),dt=diffDaysT(r.TERMINO);
  if(sp==='PAGO')return{tipo:'pago',label:'Pago',cls:'bg-green',rowCls:'',disparo:false};
  if(sp==='VENCIDO')return{tipo:'vencido',label:'Em atraso',cls:'bg-red',rowCls:'row-over',disparo:true};
  if(sp==='A VENCER'){
    if(dv!==null&&dv===0)return{tipo:'disparo',label:'Vence HOJE',cls:'bg-red',rowCls:'row-over',disparo:true};
    if(dv!==null&&dv===1)return{tipo:'disparo',label:'Vence amanha',cls:'bg-amber',rowCls:'row-warn',disparo:true};
    if(dv!==null&&dv>0&&dv<=5)return{tipo:'disparo',label:'Vcto em '+dv+'d',cls:'bg-amber',rowCls:'row-warn',disparo:true};
    if(dt!==null&&dt<=60)return{tipo:'fim60',label:'Fim em '+dt+'d',cls:'bg-blue',rowCls:'',disparo:false};
    if(dt!==null&&dt<=90)return{tipo:'fim90',label:'Fim ~'+dt+'d',cls:'bg-gray',rowCls:'',disparo:false};
    return{tipo:'avencer',label:'A vencer',cls:'bg-gray',rowCls:'',disparo:false};
  }
  return{tipo:'ok',label:'-',cls:'bg-gray',rowCls:'',disparo:false};
}
function waMsg(r,tipo){
  var nome=r.NOME.split(' ')[0];
  var resp=(r.RESPONSAVEL||'').split(' ')[0]||nome;
  var valor=parseFloat(String(r.VALOR||'0').replace(',','.')).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  var dv=diffDays(r.VCTO),dt=diffDaysT(r.TERMINO);
  if(tipo==='vencido')return'Ola '+resp+'! Tudo bem? A mensalidade do *'+nome+'* esta em aberto no valor de *'+valor+'*. Qualquer duvida, estou a disposicao!';
  if(tipo==='disparo'){
    if(dv===0)return'Ola '+resp+'! A mensalidade do *'+nome+'* vence *hoje* no valor de *'+valor+'*. Qualquer duvida estou aqui!';
    if(dv===1)return'Ola '+resp+'! A mensalidade do *'+nome+'* vence *amanha* no valor de *'+valor+'*!';
    return'Ola '+resp+'! A mensalidade do *'+nome+'* vence em *'+dv+' dias* no valor de *'+valor+'*!';
  }
  if(tipo==='fim60'||tipo==='fim90'){
    var curso=(r.CURSOS||'').split(';')[0].trim();
    return'Ola '+resp+'! O *'+nome+'* esta quase concluindo o *'+curso+'* - faltam ~'+dt+' dias! Vamos conversar sobre a proxima etapa?';
  }
  return'';
}
function waHref(r,tipo){
  var tel=(r.TELEFONE||'').replace(/\D/g,'');
  var msg=waMsg(r,tipo);
  return tel?'https://wa.me/'+tel+'?text='+encodeURIComponent(msg):'https://wa.me/?text='+encodeURIComponent(msg);
}
function spBadge(s){
  s=(s||'').trim().toUpperCase();
  if(s==='PAGO')return'<span class="bg bg-green">Pago</span>';
  if(s==='VENCIDO')return'<span class="bg bg-red">Vencido</span>';
  if(s==='A VENCER')return'<span class="bg bg-amber">A vencer</span>';
  return'<span class="bg bg-gray">'+s+'</span>';
}
function setBanner(tipo,msg){var b=document.getElementById('banner');b.className='banner banner-'+tipo;b.textContent=msg;}
function setF(f,el){filt=f;document.querySelectorAll('.fb').forEach(function(b){b.classList.remove('on');});el.classList.add('on');renderTabela();}
function buscar(v){srch=v.toLowerCase();renderTabela();}
function filtrados(){
  var d=ALUNOS.slice();
  if(srch)d=d.filter(function(r){return(r.NOME||'').toLowerCase().indexOf(srch)>-1||(r.RESPONSAVEL||'').toLowerCase().indexOf(srch)>-1;});
  if(filt==='vencido')d=d.filter(function(r){return(r.STATUS||'').toUpperCase()==='VENCIDO';});
  else if(filt==='avencer')d=d.filter(function(r){return(r.STATUS||'').toUpperCase()==='A VENCER';});
  else if(filt==='pago')d=d.filter(function(r){return(r.STATUS||'').toUpperCase()==='PAGO';});
  else if(filt==='disparo')d=d.filter(function(r){return alerta(r).disparo;});
  else if(filt==='fim60')d=d.filter(function(r){var dt=diffDaysT(r.TERMINO);return dt!==null&&dt<=60;});
  else if(filt==='fim90')d=d.filter(function(r){var dt=diffDaysT(r.TERMINO);return dt!==null&&dt>60&&dt<=90;});
  return d;
}
function renderMetrics(){
  var d=ALUNOS;
  var pagos=d.filter(function(r){return(r.STATUS||'').toUpperCase()==='PAGO';}).length;
  var vencidos=d.filter(function(r){return(r.STATUS||'').toUpperCase()==='VENCIDO';}).length;
  var avencer=d.filter(function(r){return(r.STATUS||'').toUpperCase()==='A VENCER';}).length;
  var rPaga=d.filter(function(r){return(r.STATUS||'').toUpperCase()==='PAGO';}).reduce(function(a,r){return a+parseFloat(String(r.VALOR||'0').replace(',','.'));},0);
  var rAberto=d.filter(function(r){return(r.STATUS||'').toUpperCase()!=='PAGO';}).reduce(function(a,r){return a+parseFloat(String(r.VALOR||'0').replace(',','.'));},0);
  var fim60=d.filter(function(r){var dt=diffDaysT(r.TERMINO);return dt!==null&&dt<=60;}).length;
  var disp=d.filter(function(r){return alerta(r).disparo;}).length;
  document.getElementById('metrics').innerHTML=
    '<div class="mc"><div class="lb">Total alunos</div><div class="vl">'+d.length+'</div></div>'+
    '<div class="mc"><div class="lb">Pagos</div><div class="vl" style="color:#15803d">'+pagos+'</div></div>'+
    '<div class="mc"><div class="lb">A vencer</div><div class="vl" style="color:#a16207">'+avencer+'</div></div>'+
    '<div class="mc"><div class="lb">Vencidos</div><div class="vl" style="color:#b91c1c">'+vencidos+'</div></div>'+
    '<div class="mc"><div class="lb">Receita paga</div><div class="vl" style="color:#15803d;font-size:15px">'+rPaga.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})+'</div></div>'+
    '<div class="mc"><div class="lb">Em aberto</div><div class="vl" style="color:#b91c1c;font-size:15px">'+rAberto.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})+'</div></div>'+
    '<div class="mc"><div class="lb">Fim em 60d</div><div class="vl" style="color:#1e40af">'+fim60+'</div><div class="sb">ofertar curso</div></div>'+
    '<div class="mc"><div class="lb">Disparar hoje</div><div class="vl" style="color:#a16207">'+disp+'</div><div class="sb">cobrancas</div></div>';
}
function renderTabela(){
  var d=filtrados();
  var tb=document.getElementById('tbody');
  if(!d.length){tb.innerHTML='<tr><td colspan="10"><div class="nr">Nenhum resultado</div></td></tr>';return;}
  tb.innerHTML=d.map(function(r){
    var a=alerta(r);
    var waType=a.tipo==='fim60'||a.tipo==='fim90'?a.tipo:(a.tipo==='vencido'?'vencido':'disparo');
    var showWa=a.tipo!=='pago'&&a.tipo!=='ok';
    var btnLabel=a.tipo==='fim60'||a.tipo==='fim90'?'Ofertar':'Cobrar WA';
    var btnCls=a.tipo==='fim60'||a.tipo==='fim90'?'wa ofertar':'wa';
    var nShort=(r.NOME||'').split(' ').slice(0,2).join(' ');
    var rShort=(r.RESPONSAVEL||'').split(' ').slice(0,2).join(' ');
    var cursos=r.CURSOS||'';
    var cursoShort=cursos.length>30?cursos.substring(0,29)+'...':cursos;
    var isVC=(r.STATUS_CONTRATO||'').toLowerCase().indexOf('vencido')>-1;
    var valor=parseFloat(String(r.VALOR||'0').replace(',','.')).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    return'<tr class="'+a.rowCls+'">'+
      '<td><div style="font-weight:700;font-size:12px">'+nShort+'</div><div style="font-size:10px;color:#999">'+r.CODIGO+(isVC?' <span class="bg bg-purple" style="font-size:9px">vencido</span>':'')+'</div></td>'+
      '<td style="font-size:11px;color:#555">'+rShort+'</td>'+
      '<td style="font-size:11px" title="'+cursos+'">'+cursoShort+'</td>'+
      '<td style="font-size:11px">'+fmtMes(r.TERMINO)+'</td>'+
      '<td style="font-size:11px">'+r.VCTO+'</td>'+
      '<td style="font-size:11px;color:#777">'+r.PGTO+'</td>'+
      '<td style="font-size:11px;font-weight:700">'+valor+'</td>'+
      '<td>'+spBadge(r.STATUS)+'</td>'+
      '<td><span class="bg '+a.cls+'">'+a.label+'</span></td>'+
      '<td>'+(showWa?'<a class="'+btnCls+'" href="'+waHref(r,waType)+'" target="_blank">'+btnLabel+'</a>':'<span style="color:#ccc">-</span>')+'</td>'+
      '</tr>';
  }).join('');
}
function exportarCSV(){
  var headers=['Nome','Responsavel','Telefone','Cursos','Termino','Vcto','Pgto','Valor','Status'];
  var rows=ALUNOS.map(function(r){return[r.NOME,r.RESPONSAVEL,r.TELEFONE,r.CURSOS,r.TERMINO,r.VCTO,r.PGTO,r.VALOR,r.STATUS].map(function(v){return'"'+(v||'').replace(/"/g,'""')+'"';}).join(',');});
  var csv='\uFEFF'+[headers.join(',')].concat(rows).join('\n');
  var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='alunos.csv';a.click();
}
var MAP={'NOME':'NOME','CODIGO':'CODIGO','IDADE':'IDADE','CURRICULOS ATIVOS':'CURSOS','STATUS DO CONTRATO':'STATUS_CONTRATO','RESPONSAVEL PRINCIPAL':'RESPONSAVEL','TERMINO CURSO':'TERMINO','TELEFONE':'TELEFONE','VCTO':'VCTO','PAGTO':'PGTO','PGTO':'PGTO','VALOR':'VALOR','STATUS':'STATUS'};
async function carregarDados(){
  try{
    setBanner('blue','Carregando dados da planilha...');
    var res=await fetch(APPS_URL);
    if(!res.ok)throw new Error('HTTP '+res.status);
    var json=await res.json();
    if(!json||!json.length)throw new Error('Planilha vazia');
    ALUNOS=json.map(function(row){
      var obj={};
      Object.keys(row).forEach(function(k){
        var key=MAP[norm(k)]||norm(k);
        var val=row[k];
        if(key==='VCTO'||key==='PGTO')val=isoToDia(val);
        else if(key==='TERMINO')val=isoToMesAno(val);
        else val=String(val===null||val===undefined?'':val).replace(/\n/g,' ').trim();
        obj[key]=val;
      });
      return obj;
    }).filter(function(r){return r.NOME&&r.NOME.trim()!==''&&r.NOME!=='NOME';});
    if(!ALUNOS.length)throw new Error('Sem registros');
    setBanner('green','Conectado! '+ALUNOS.length+' alunos carregados. '+new Date().toLocaleTimeString('pt-BR'));
  }catch(e){
    console.error(e);
    setBanner('red','Erro: '+e.message);
  }
  renderMetrics();renderTabela();
}
carregarDados();
</script>
</body>
</html>
